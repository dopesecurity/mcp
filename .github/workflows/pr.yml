name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: make install
      - run: make check

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: make install
      - run: make integration-tests
        env:
          DOPE_MCP_TESTS_CLIENT_SECRET: ${{ secrets.DOPE_MCP_TESTS_CLIENT_SECRET }}
