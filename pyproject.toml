[project]
name = "dopesecurity-mcp-server"
dynamic = ["version"]
description = "Local MCP server for the dope.security Flightdeck partner API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dope.security" }]
keywords = ["mcp", "model-context-protocol", "ai", "dope.security", "security", "swg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.2",
    "structlog>=24.1.0",
]

[project.urls]
Homepage = "https://dope.security"
Repository = "https://github.com/dopesecurity/mcp"
Changelog = "https://github.com/dopesecurity/mcp/blob/main/CHANGELOG.md"

[project.scripts]
dopesecurity-mcp-server = "dopesecurity.mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/dopesecurity"]
exclude = ["**/tests/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/dopesecurity",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/VERSION",
    "/pyproject.toml",
]
exclude = ["**/tests/**"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dopesecurity.mcp_server"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error"]
